<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Castor Alviar DTS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#f4f6fa;
    --surface:#ffffff;
    --surface-2:#eef1f6;
    --border:#dde3ec;
    --ink:#1b2430;
    --ink-muted:#5c6a7a;
    --ink-faint:#8b96a3;
    --navy:#0b3d6e;
    --navy-deep:#082c52;
    --navy-tint:#e7eef7;
    --gold:#b98a2e;
    --gold-tint:#f6ecd6;
    --st-pending-fg:#3d5875; --st-pending-bg:#e4ebf3;
    --st-process-fg:#1f7a72; --st-process-bg:#e0f3f0;
    --st-hold-fg:#966214;    --st-hold-bg:#faedd4;
    --st-good-fg:#1f7a45;    --st-good-bg:#e2f4e9;
    --st-bad-fg:#a3352b;     --st-bad-bg:#fbe6e3;
    --shadow: 0 1px 2px rgba(11,61,110,0.06), 0 8px 24px -12px rgba(11,61,110,0.18);
    --focus: 0 0 0 3px rgba(11,61,110,0.25);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#121722; --surface:#1a212d; --surface-2:#212a38; --border:#2c3648;
      --ink:#e8edf5; --ink-muted:#a4b1c2; --ink-faint:#77869a;
      --navy:#5c9ae0; --navy-deep:#0e2036; --navy-tint:#1c2e46;
      --gold:#dcb15c; --gold-tint:#332a16;
      --st-pending-fg:#a9c3e0; --st-pending-bg:#22344a;
      --st-process-fg:#8fe0d4; --st-process-bg:#123531;
      --st-hold-fg:#f0c775;    --st-hold-bg:#3a2c0f;
      --st-good-fg:#8fe0ac;    --st-good-bg:#123324;
      --st-bad-fg:#f0a99f;     --st-bad-bg:#3a1a16;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
      --focus: 0 0 0 3px rgba(92,154,224,0.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#121722; --surface:#1a212d; --surface-2:#212a38; --border:#2c3648;
    --ink:#e8edf5; --ink-muted:#a4b1c2; --ink-faint:#77869a;
    --navy:#5c9ae0; --navy-deep:#0e2036; --navy-tint:#1c2e46;
    --gold:#dcb15c; --gold-tint:#332a16;
    --st-pending-fg:#a9c3e0; --st-pending-bg:#22344a;
    --st-process-fg:#8fe0d4; --st-process-bg:#123531;
    --st-hold-fg:#f0c775;    --st-hold-bg:#3a2c0f;
    --st-good-fg:#8fe0ac;    --st-good-bg:#123324;
    --st-bad-fg:#f0a99f;     --st-bad-bg:#3a1a16;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    --focus: 0 0 0 3px rgba(92,154,224,0.35);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--paper); color:var(--ink); font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif; font-size:14.5px; line-height:1.5; margin:0;}
  h1,h2,h3{font-family:"Source Serif 4",Georgia,serif; font-weight:700; text-wrap:balance; margin:0;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--navy);}
  button{font-family:inherit; cursor:pointer;}
  :focus-visible{outline:none; box-shadow:var(--focus); border-radius:6px;}

  /* ===== pre-login public shell ===== */
  .public-wrap{max-width:1000px; margin:0 auto; padding:0 20px 64px;}
  .public-top{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 0; border-bottom:1px solid var(--border); margin-bottom:22px;}
  .brand{display:flex; align-items:center; gap:14px;}
  .seal{
    width:44px; height:44px; border-radius:50%; flex:none;
    background:radial-gradient(circle at 32% 28%, var(--navy) 0%, var(--navy-deep) 72%);
    border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:"Source Serif 4",serif; font-weight:700; font-size:14px;
  }
  .brand-text h1{font-size:18px; color:var(--ink);}
  .brand-text .sub{font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--ink-muted); font-weight:600; margin-top:2px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 16px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:600;
  }
  .btn:hover{filter:brightness(0.97);}
  :root[data-theme="dark"] .btn:hover{filter:brightness(1.15);}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:hover{filter:brightness(1.15);}}
  .btn-primary{background:var(--navy); border-color:var(--navy); color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-gold{background:var(--gold); border-color:var(--gold); color:#2a1f08;}
  .btn-ghost{background:none; border-color:transparent; color:var(--navy);}
  .btn-danger{background:none; border-color:var(--border); color:var(--st-bad-fg);}
  .btn[disabled]{opacity:0.5; cursor:not-allowed;}
  .btn-sm{padding:6px 11px; font-size:12.5px; border-radius:7px;}
  .btn-block{width:100%;}

  label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-muted); margin-bottom:5px;}
  input,select,textarea{
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font:inherit; font-size:13.5px;
  }
  textarea{resize:vertical; min-height:64px;}
  .field{margin-bottom:14px;}
  .row{display:grid; gap:14px;}
  .row-2{grid-template-columns:1fr 1fr;}
  .row-3{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:640px){.row-2,.row-3{grid-template-columns:1fr;}}
  .hint{font-size:12px; color:var(--ink-faint); margin-top:5px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px; box-shadow:var(--shadow);}
  .card + .card{margin-top:18px;}
  .card-title{font-size:16px; margin-bottom:4px;}
  .card-desc{color:var(--ink-muted); font-size:13px; margin-bottom:16px;}

  .track-hero{background:linear-gradient(155deg, var(--navy-deep), var(--navy)); border-radius:16px; padding:34px 28px; color:#fff; margin-bottom:20px;}
  .track-hero h2{color:#fff; font-size:22px; margin-bottom:6px;}
  .track-hero p{color:rgba(255,255,255,0.78); font-size:13.5px; margin:0 0 18px;}
  .track-form{display:flex; gap:10px; max-width:560px;}
  .track-form input{background:rgba(255,255,255,0.96); border:none; font-size:14.5px; padding:12px 14px;}
  .track-form .btn-gold{padding:0 22px; font-size:13.5px;}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .chip{background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28); color:#fff; border-radius:999px; padding:5px 12px; font-size:12px; font-family:"IBM Plex Mono",monospace;}
  .chip:hover{background:rgba(255,255,255,0.22);}

  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:0.02em; white-space:nowrap;}
  .pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .pill-pending{color:var(--st-pending-fg); background:var(--st-pending-bg);}
  .pill-process{color:var(--st-process-fg); background:var(--st-process-bg);}
  .pill-hold{color:var(--st-hold-fg); background:var(--st-hold-bg);}
  .pill-good{color:var(--st-good-fg); background:var(--st-good-bg);}
  .pill-bad{color:var(--st-bad-fg); background:var(--st-bad-bg);}
  .badge-sample{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--gold); background:var(--gold-tint); padding:2px 8px; border-radius:6px;}

  .doc-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:6px;}
  .doc-track{font-size:19px; font-weight:700;}
  .doc-title{font-size:14.5px; margin:8px 0 14px; color:var(--ink);}
  .meta-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; padding:14px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); margin-bottom:18px;}
  .meta-item .k{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); font-weight:700; margin-bottom:3px;}
  .meta-item .v{font-size:13.5px; font-weight:600;}

  .timeline{list-style:none; margin:0; padding:0;}
  .timeline li{position:relative; padding:0 0 20px 26px; border-left:2px solid var(--border); margin-left:5px;}
  .timeline li:last-child{border-color:transparent; padding-bottom:2px;}
  .timeline li::before{content:""; position:absolute; left:-7px; top:2px; width:12px; height:12px; border-radius:50%; background:var(--navy); border:2px solid var(--surface);}
  .timeline .t-label{font-weight:700; font-size:13.5px;}
  .timeline .t-meta{font-size:12px; color:var(--ink-muted); margin-top:2px;}
  .timeline .t-remarks{font-size:13px; color:var(--ink); margin-top:5px; background:var(--surface-2); border-radius:8px; padding:8px 10px;}

  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:12px;}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:680px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); font-weight:700; padding:10px 14px; background:var(--surface-2); white-space:nowrap;}
  td{padding:11px 14px; border-top:1px solid var(--border); vertical-align:middle;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr.clickable:hover{background:var(--surface-2);}
  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .filters > *{min-width:150px; flex:1;}
  .filters input{min-width:200px; flex:2;}
  .icon-btn{width:30px; height:30px; border-radius:50%; border:none; background:var(--navy); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:14px;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:18px;}
  .stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px;}
  .stat-tile .n{font-family:"Source Serif 4",serif; font-size:26px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stat-tile .l{font-size:12px; color:var(--ink-muted); font-weight:600; margin-top:2px;}
  .bar-row{display:flex; align-items:center; gap:10px; font-size:13px; padding:7px 0;}
  .bar-row .lbl{width:190px; flex:none; color:var(--ink-muted); font-weight:500;}
  .bar-track{flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--navy); border-radius:99px;}
  .bar-n{width:26px; text-align:right; font-weight:700; font-variant-numeric:tabular-nums;}

  .overlay{position:fixed; inset:0; background:rgba(8,14,24,0.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; overflow-y:auto;}
  .modal{background:var(--surface); border-radius:14px; padding:26px; max-width:460px; width:100%; box-shadow:var(--shadow); max-height:88vh; overflow-y:auto;}
  .modal-wide{max-width:640px;}
  .modal-xwide{max-width:760px;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .x-btn{background:none; border:none; color:var(--ink-muted); font-size:20px; line-height:1; padding:2px;}
  .error-box{background:var(--st-bad-bg); color:var(--st-bad-fg); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:12px;}
  .notice{background:var(--navy-tint); color:var(--navy); font-size:12.5px; padding:10px 12px; border-radius:9px; margin-top:14px;}
  .empty{text-align:center; padding:40px 20px; color:var(--ink-muted); font-size:13.5px;}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:9px; font-size:13px; font-weight:600; box-shadow:var(--shadow); z-index:80;}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:var(--surface); border:1px solid var(--border); color:var(--ink);}}
  :root[data-theme="dark"] .toast{background:var(--surface); border:1px solid var(--border); color:var(--ink);}
  .list-manage{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--border); gap:10px;}
  .list-manage:first-of-type{border-top:none;}
  .banner{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--gold-tint); border:1px solid var(--gold); color:var(--ink); padding:10px 14px; border-radius:10px; font-size:12.5px; margin-bottom:18px; flex-wrap:wrap;}
  footer.pubfoot{text-align:center; color:var(--ink-faint); font-size:12px; margin-top:44px;}

  /* ===== logged-in app shell (sidebar) ===== */
  .shell{display:flex; min-height:100vh;}
  .sidebar{width:250px; flex:none; background:linear-gradient(180deg, var(--navy-deep), var(--navy) 60%); color:#fff; display:flex; flex-direction:column; position:relative; transition:width .15s ease;}
  .sidebar.collapsed{width:74px;}
  .sidebar.collapsed .label, .sidebar.collapsed .sidebar-profile .who-text, .sidebar.collapsed .sidebar-brand .txt{display:none;}
  .collapse-btn{position:absolute; top:14px; right:-14px; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.9); color:var(--navy-deep); border:none; font-size:12px;}
  .sidebar-profile{display:flex; flex-direction:column; align-items:center; text-align:center; padding:26px 16px 18px; border-bottom:1px solid rgba(255,255,255,0.14);}
  .avatar-circle{width:58px; height:58px; border-radius:50%; background:rgba(255,255,255,0.92); display:flex; align-items:center; justify-content:center; margin-bottom:10px; flex:none;}
  .who-text .name{font-weight:700; font-size:14px;}
  .who-text .title{font-size:11.5px; color:rgba(255,255,255,0.72); margin-top:2px;}
  .sidebar-brand{display:flex; align-items:center; gap:10px; padding:16px; border-bottom:1px solid rgba(255,255,255,0.14);}
  .sidebar-brand .logo-dot{width:34px; height:34px; border-radius:9px; background:var(--gold); color:#2a1f08; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex:none;}
  .sidebar-brand .txt .t1{font-weight:700; font-size:14px; letter-spacing:0.03em;}
  .sidebar-brand .txt .t2{font-size:10.5px; color:rgba(255,255,255,0.65);}
  .sidebar-nav{padding:12px 10px; flex:1;}
  .snav-item{display:flex; align-items:center; gap:12px; width:100%; padding:11px 12px; border-radius:9px; border:none; background:none; color:rgba(255,255,255,0.82); font-size:13.5px; font-weight:600; text-align:left; margin-bottom:2px;}
  .snav-item .ic{width:18px; text-align:center; flex:none;}
  .snav-item:hover{background:rgba(255,255,255,0.08); color:#fff;}
  .snav-item.active{background:rgba(255,255,255,0.16); color:#fff;}
  .snav-badge{margin-left:auto; background:var(--gold); color:#2a1f08; font-size:10.5px; font-weight:700; border-radius:999px; padding:1px 7px;}
  .snav-chev{margin-left:auto; transition:transform .15s;}
  .snav-chev.open{transform:rotate(90deg);}
  .snav-sub{padding-left:32px; margin-bottom:4px;}
  .snav-sub button{display:block; width:100%; text-align:left; background:none; border:none; color:rgba(255,255,255,0.68); font-size:12.5px; font-weight:600; padding:7px 8px; border-radius:7px;}
  .snav-sub button:hover{color:#fff; background:rgba(255,255,255,0.06);}
  .snav-sub button.active{color:#fff; background:rgba(255,255,255,0.14);}
  .sidebar-foot{padding:14px 16px; font-size:10.5px; color:rgba(255,255,255,0.5); border-top:1px solid rgba(255,255,255,0.14);}

  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar2{display:flex; align-items:center; justify-content:space-between; padding:14px 26px; border-bottom:1px solid var(--border); background:var(--surface);}
  .server-time{color:var(--st-good-fg); font-size:13px; font-weight:600; font-family:"IBM Plex Mono",monospace;}
  .account-wrap{position:relative;}
  .account-btn{display:flex; align-items:center; gap:8px; background:none; border:none; font-size:13.5px; font-weight:600; color:var(--ink);}
  .account-menu{position:absolute; right:0; top:calc(100% + 8px); background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); min-width:180px; overflow:hidden; z-index:40;}
  .account-menu button{display:block; width:100%; text-align:left; padding:10px 14px; background:none; border:none; font-size:13px; color:var(--ink);}
  .account-menu button:hover{background:var(--surface-2);}
  .crumbline{display:flex; justify-content:flex-end; gap:8px; align-items:center; padding:12px 26px 0; font-size:12px; color:var(--ink-faint); font-weight:600;}
  .content{padding:18px 26px 50px; flex:1;}

  /* ===== messages ===== */
  .pagination{display:flex; gap:6px; justify-content:flex-end; margin-top:14px;}
  .pagination button{padding:6px 11px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:12.5px; font-weight:600;}
  .pagination button.active{background:var(--navy); border-color:var(--navy); color:#fff;}
  .pagination button[disabled]{opacity:0.4;}
  .msg-row.unread{font-weight:700;}

  /* ===== submission and routing slip (printable) ===== */
  .routing-slip{border:1.5px solid #111; padding:16px 18px; background:#fff; color:#111; margin-bottom:6px; font-size:11px;}
  .rs-letterhead{text-align:center; margin-bottom:6px;}
  .rs-letterhead .country{font-size:10px; letter-spacing:0.04em;}
  .rs-letterhead .dept{font-family:"Source Serif 4",serif; font-weight:700; font-size:15px; margin:1px 0;}
  .rs-letterhead .sch{font-size:10.5px; font-weight:600;}
  .rs-title{text-align:center; font-weight:700; font-size:13px; letter-spacing:0.04em; border-top:2px solid #111; border-bottom:2px solid #111; padding:6px 0; margin-bottom:8px;}
  .claim-stub-banner{text-align:center; font-weight:700; font-size:13px; letter-spacing:0.1em; background:#111; color:#fff; padding:6px 0; margin-bottom:8px; border-radius:3px;}
  .rs-field-row{display:flex; gap:16px; border-bottom:1px solid #ccd; font-size:11px; padding:4px 0; flex-wrap:wrap;}
  .rs-field-row .lab{font-weight:700; margin-right:4px;}
  .rs-field-row > div{flex:1; min-width:140px;}
  .rs-section-title{font-weight:700; font-size:10.5px; letter-spacing:0.03em; text-decoration:underline; margin:10px 0 5px;}
  .rs-checks{display:grid; grid-template-columns:repeat(3,1fr); gap:4px 14px; font-size:10.5px; margin-bottom:6px;}
  .rs-check{display:flex; align-items:flex-start; gap:5px; line-height:1.3;}
  .rs-box{width:10px; height:10px; border:1px solid #111; flex:none; margin-top:1.5px; display:inline-block; text-align:center; font-size:9px; line-height:9px;}
  .rs-box.on{background:#111; color:#fff;}
  .rs-table{width:100%; border-collapse:collapse; font-size:9.3px; margin-top:4px;}
  .rs-table th,.rs-table td{border:1px solid #111; padding:4px 5px; vertical-align:top;}
  .rs-table th{background:#eef1f6; font-size:8.7px; text-transform:uppercase; letter-spacing:0.02em;}
  .rs-table td.rs-blank{color:#99a;}
  .rs-actiontaken-list{margin:0; padding:0; list-style:none;}
  .rs-actiontaken-list li{display:flex; gap:4px; align-items:flex-start;}
  .cut-line{display:flex; align-items:center; gap:8px; color:var(--ink-faint); font-size:11px; margin:14px 0;}
  .cut-line::before, .cut-line::after{content:""; flex:1; border-top:1px dashed var(--ink-faint);}

  /* ===== transmittal slip (principal → personnel) ===== */
  .sig-cols{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:14px;}
  @media (max-width:760px){.sig-cols{grid-template-columns:1fr;}}
  .sig-col h4{font-size:12px; margin-bottom:8px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-muted);}
  .sig-row{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
  .sig-row input[type="checkbox"]{width:auto; flex:none;}
  .sig-row .sig-name{font-weight:600; font-size:13px; flex:1; min-width:120px;}
  .sig-row .sig-email{flex:1; min-width:150px;}
  .check-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px 14px; margin-bottom:10px;}
  @media (max-width:760px){.check-grid{grid-template-columns:1fr;}}
  .check-item{display:flex; align-items:flex-start; gap:7px; font-size:13px;}
  .check-item input[type="checkbox"]{width:auto; margin-top:3px; flex:none;}
  .file-drop{border:1.5px dashed var(--border); border-radius:10px; padding:14px; text-align:center; font-size:12.5px; color:var(--ink-muted);}
  .transmittal-list-item{border-top:1px solid var(--border); padding:12px 0;}
  .transmittal-list-item:first-child{border-top:none;}
  .recipient-tag{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; background:var(--surface-2); border-radius:999px; padding:3px 9px; margin:2px 3px 0 0;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute; left:0; top:0; width:100%;}
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ============ constants ============ */
  var DOC_TYPES = ["Memorandum","Letter / Communication","DepEd Order / Advisory","Request","Report","Certification / Endorsement","Complaint","Other"];
  var STATUSES = ["Pending","In Process","On Hold","Released / Completed","Returned / Disapproved"];
  var STATUS_CLASS = {
    "Pending":"pill-pending","In Process":"pill-process","On Hold":"pill-hold",
    "Released / Completed":"pill-good","Returned / Disapproved":"pill-bad"
  };
  var ACTION_NEEDED_OPTIONS = ["For signature/approval","For review/comment","For filing","For recommendation","Others"];
  var ACTION_TAKEN_OPTIONS = ["reviewed/approved","reviewed/for revision","incomplete attachment/return to owner","noted/for filing"];
  var TRANSMITTAL_ACTIONS = {
    col1: ["Congratulations!","Thanks for your effort","Let us discuss","For submission/DTS","For filing","For dissemination"],
    col2: ["For your information","For comment","For checking","For signature","For compliance","For implementation"],
    col3: ["Please give an update","Please draft a reply","Please prepare response","Please review/recommend","Please prepare indorsement"]
  };
  var SUBMISSION_TYPES = ["Hard Copy","Soft Copy"];
  var DEFAULT_OFFICES = [
    "Office of the School Principal","Office of the Assistant Principal","Registrar's Office",
    "Guidance Office","Records / Administrative Office","Property & Supply Office",
    "Accounting / Disbursing Office","General Services"
  ];
  var PERSONNEL_SEED = [
    { name:"Gerald M. Flores", category:"Department Head" },
    { name:"Luz D. Gibas", category:"Department Head" },
    { name:"Catherine B. Canape", category:"Department Head" },
    { name:"JMar I. Almazan", category:"Master Teacher" },
    { name:"Rio R. Avila", category:"Master Teacher" },
    { name:"Rey Gene B. Cordovilla", category:"Master Teacher" },
    { name:"Marilou Lladones", category:"SPC/Finance" },
    { name:"Klein Angelo B. Estenor", category:"SPC/Finance" },
    { name:"Brian Kenneth Q. Sipriaso", category:"SPC/Finance" }
  ];
  var SIGNATORY_CATEGORIES = ["Department Head","Master Teacher","SPC/Finance"];

  function uid(p){ return p + Math.random().toString(36).slice(2,9); }
  function nowIso(){ return new Date().toISOString(); }
  function randCode(){ var c="ABCDEFGHJKLMNPQRSTUVWXYZ123456789"; var s=""; for(var i=0;i<3;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }

  /* ============ in-memory fallback state ============ */
  var mem = { offices:{}, staff:{}, documents:{}, messages:{}, personnel:{}, transmittals:{}, counter:0, schoolInfo:{
    schoolId:"301527", schoolName:"Castor Alviar National High School",
    address:"Masili, Calamba City, Laguna", contact:"", email:"",
    principalName:"Rhoda O. Dela Cruz", principalTitle:"School Principal"
  }};

  (function seedMem(){
    DEFAULT_OFFICES.forEach(function(name,i){ var id="off_"+i; mem.offices[id]={id:id,name:name,order:i}; });
    function offByName(n){ for(var k in mem.offices){ if(mem.offices[k].name===n) return k; } return Object.keys(mem.offices)[0]; }

    mem.staff["st_1"] = { id:"st_1", name:"Ruby B. Rodelas", title:"School Incharge", officeId:offByName("Records / Administrative Office"), role:"admin", pin:"1234" };
    mem.staff["st_2"] = { id:"st_2", name:"Registrar Clerk", title:"Registrar's Office Staff", officeId:offByName("Registrar's Office"), role:"staff", pin:"2222" };

    PERSONNEL_SEED.forEach(function(p,i){ var id="per_"+i; mem.personnel[id]={ id:id, name:p.name, category:p.category, email:"" }; });

    function dtsNo(seq, code){ return mem.schoolInfo.schoolId + "-" + code + "-2026-" + String(seq).padStart(6,"0"); }

    function mkDoc(n, seq, code, type, title, owner, contact, email, folders, numPages, destOfficeName, action, subType, status, hist, daysAgo){
      var id = "doc_"+n;
      var created = new Date(Date.now()-daysAgo*86400000).toISOString();
      mem.documents[id] = {
        id:id, dtsNo: dtsNo(seq,code), docType:type, title:title,
        documentOwner:owner, contactNo:contact, email:email, foldersBoxes:folders, numPages:numPages,
        destinationOfficeId: offByName(destOfficeName), destinationOfficeName: destOfficeName,
        actionNeeded:action, actionOtherText:"", submissionType:subType, fileLink:"",
        status:status, sample:true, createdAt:created, createdBy:"Ruby B. Rodelas",
        updatedAt: hist[hist.length-1].at, history:hist
      };
      mem.counter++;
    }
    mkDoc(1,1220,"QTP","DepEd Order / Advisory","DepEd Order No. 010, s. 2026 – Revised School Calendar for SY 2026-2027",
      "Office of the School Principal","09171934722","principal@canhs.deped.gov.ph","1 folder","3","Office of the School Principal","For filing","Hard Copy","In Process",
      [
        {label:"Received at Records / Administrative Office", status:"Pending", remarks:"Received via SDO liaison.", byStaffName:"Ruby B. Rodelas", officeName:"Records / Administrative Office", actionTaken:[], actionOther:"", at:new Date(Date.now()-6*86400000).toISOString()},
        {label:"Forwarded to Office of the School Principal", status:"In Process", remarks:"For instruction and dissemination to department heads.", byStaffName:"Ruby B. Rodelas", officeName:"Office of the School Principal", actionTaken:["noted/for filing"], actionOther:"", at:new Date(Date.now()-5*86400000).toISOString()}
      ], 6);
    mkDoc(2,1221,"OQ8","Request","Application for Leave (Form 6) of Reynalyn Romales (Study Leave)",
      "Reynalyn Romales","09175551234","reynalyn.romales@deped.gov.ph","—","1","Records / Administrative Office","For signature/approval","Hard Copy","Released / Completed",
      [
        {label:"Received at Records / Administrative Office", status:"Pending", remarks:"Walk-in submission.", byStaffName:"Ruby B. Rodelas", officeName:"Records / Administrative Office", actionTaken:[], actionOther:"", at:new Date(Date.now()-4*86400000).toISOString()},
        {label:"Marked In Process", status:"In Process", remarks:"Endorsed for approval.", byStaffName:"Ruby B. Rodelas", officeName:"Records / Administrative Office", actionTaken:["reviewed/approved"], actionOther:"", at:new Date(Date.now()-3*86400000).toISOString()},
        {label:"Marked Released / Completed", status:"Released / Completed", remarks:"Approved and released to employee 201 file.", byStaffName:"Ruby B. Rodelas", officeName:"Records / Administrative Office", actionTaken:["noted/for filing"], actionOther:"", at:new Date(Date.now()-2*86400000).toISOString()}
      ], 4);
    mkDoc(3,1222,"JFD","Report","September 2026 Monthly Accomplishment Report",
      "Office of the School Principal","09171934722","principal@canhs.deped.gov.ph","—","5","Records / Administrative Office","For filing","Soft Copy","Pending",
      [
        {label:"Logged for transmittal at Records / Administrative Office", status:"Pending", remarks:"Awaiting Principal's signature before transmittal to SDO.", byStaffName:"Ruby B. Rodelas", officeName:"Records / Administrative Office", actionTaken:[], actionOther:"", at:new Date(Date.now()-1*86400000).toISOString()}
      ], 1);
    mkDoc(4,1223,"OTM","Letter / Communication","Clearance of Leila L. Aniel re Division Clearance for Retirement from Service",
      "Leila L. Aniel","09171934722","ruby.rodelas@deped.gov.ph","1 envelope","1","Registrar's Office","For signature/approval","Hard Copy","In Process",
      [
        {label:"Received at Records / Administrative Office", status:"Pending", remarks:"", byStaffName:"Ruby B. Rodelas", officeName:"Records / Administrative Office", actionTaken:[], actionOther:"", at:new Date(Date.now()-2*86400000).toISOString()},
        {label:"Forwarded to Registrar's Office", status:"In Process", remarks:"For preparation of clearance and Form 137.", byStaffName:"Registrar Clerk", officeName:"Registrar's Office", actionTaken:["reviewed/approved"], actionOther:"", at:new Date(Date.now()-1.2*86400000).toISOString()}
      ], 2);

    var sample4 = mem.documents["doc_4"];
    mem.messages["msg_1"] = {
      id:"msg_1", dtsNo: sample4.dtsNo, subject:"Follow-up DTS No. "+sample4.dtsNo,
      from: mem.schoolInfo.schoolId+"-Castor Alviar NHS", body:"Please attach the notarized affidavit before we can process the clearance further.",
      sentAt: new Date(Date.now()-1*86400000).toISOString(), read:true
    };
  })();

  /* ============ backend API (Netlify Function + Blobs) ============ */
  var API_BASE = "/.netlify/functions/data";
  var live = false; // true once the first successful server response has been applied

  function officesArr(){ return Object.values(mem.offices).sort(function(a,b){return a.order-b.order;}); }
  function staffArr(){ return Object.values(mem.staff); }
  function documentsArr(){ return Object.values(mem.documents).sort(function(a,b){ return new Date(b.updatedAt||b.createdAt) - new Date(a.updatedAt||a.createdAt); }); }
  function messagesArr(){ return Object.values(mem.messages).sort(function(a,b){ return new Date(b.sentAt)-new Date(a.sentAt); }); }
  function personnelArr(){ return Object.values(mem.personnel); }
  function personnelByCategory(cat){ return personnelArr().filter(function(p){return p.category===cat;}); }
  function transmittalsArr(){ return Object.values(mem.transmittals).sort(function(a,b){ return new Date(b.sentAt||b.date)-new Date(a.sentAt||a.date); }); }

  async function apiGet(){
    var res = await fetch(API_BASE, { headers:{ "Accept":"application/json" } });
    if(!res.ok) throw new Error("Request failed ("+res.status+")");
    return res.json();
  }
  async function apiPost(op, payload){
    var body = Object.assign({ op: op }, payload||{});
    var res = await fetch(API_BASE, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
    if(!res.ok) throw new Error("Request failed ("+res.status+")");
    return res.json();
  }
  function applyData(data){
    if(!data) return;
    mem.offices = data.offices || {};
    mem.staff = data.staffPublic || {};
    mem.documents = data.documents || {};
    mem.messages = data.messages || {};
    mem.personnel = data.personnel || {};
    mem.transmittals = data.transmittals || {};
    mem.schoolInfo = data.schoolInfo || mem.schoolInfo;
  }
  async function loadAndRender(){
    try{
      var data = await apiGet();
      applyData(data);
      live = true;
      render();
    }catch(e){ /* keep showing last known data; the periodic refresh will retry */ }
  }

  /* ============ app state ============ */
  var state = {
    view: "track", // pre-login: "track"; post-login: "dashboard","messages","submit","status","admin"
    session: null,
    showLogin: false, loginErr: "",
    trackQuery: "", trackResult: undefined,
    detailId: null, transmittalId: null,
    filters: { status:"", office:"", q:"" },
    statusSubOpen: true,
    accountMenuOpen: false,
    sidebarCollapsed: false,
    messagesPage: 1,
    toast: null
  };
  try{ var saved = localStorage.getItem("canhs_dts_session"); if(saved) state.session = JSON.parse(saved); }catch(e){}
  if(state.session) state.view = "dashboard";

  function setState(patch){ Object.assign(state, patch); render(); }
  function showToast(msg){ state.toast = msg; render(); setTimeout(function(){ state.toast=null; render(); }, 2600); }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function fmtDate(iso){ if(!iso) return "—"; var d=new Date(iso); return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
  function fmtDateTime(iso){ if(!iso) return "—"; var d=new Date(iso); return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) + " · " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
  function officeName(id){ return (mem.offices[id]&&mem.offices[id].name)||"—"; }
  function currentStaff(){ return state.session; }
  function isAdmin(){ var s=currentStaff(); return !!s && s.role==="admin"; }
  function shortSchoolName(){ return (mem.schoolInfo.schoolName||"").replace(/National High School/i,"NHS"); }

  /* ============ actions (talk to the Netlify Function) ============ */
  async function doLogin(staffId, pin){
    try{
      var res = await apiPost("login", { staffId:staffId, pin:pin });
      if(!res.ok){ setState({ loginErr:"Incorrect PIN. Please try again." }); return; }
      var session = res.staff;
      try{ localStorage.setItem("canhs_dts_session", JSON.stringify(session)); }catch(e){}
      setState({ session:session, showLogin:false, loginErr:"", view:"dashboard" });
    }catch(e){ setState({ loginErr:"Couldn't reach the server. Check your connection and try again." }); }
  }
  function doLogout(){ try{ localStorage.removeItem("canhs_dts_session"); }catch(e){} setState({ session:null, view:"track", accountMenuOpen:false }); }

  function notifySuffix(notify){
    if(!notify || !isAdmin()) return "";
    var bits = [];
    if(notify.email && !notify.email.sent && notify.email.reason==="not_configured") bits.push("email not configured");
    if(notify.sms && !notify.sms.sent && notify.sms.reason==="not_configured") bits.push("SMS not configured");
    return bits.length ? (" (owner notification skipped — "+bits.join(", ")+")") : (notify.email&&notify.email.sent ? " — owner notified by email/SMS." : "");
  }

  async function submitNewDocument(form){
    var staff = currentStaff();
    try{
      var res = await apiPost("addDocument", { payload: form, actorStaffId: staff.id });
      if(!res.ok){ showToast(res.error||"Couldn't save — try again."); return; }
      applyData(res.data);
      setState({ view:"submit", transmittalId: res.id });
      var newDoc = mem.documents[res.id];
      showToast("Document logged — DTS No. "+(newDoc?newDoc.dtsNo:"")+notifySuffix(res.notify));
    }catch(e){ showToast("Couldn't reach the server — try again."); }
  }

  async function forwardDocument(docId, toOfficeId, remarks, actionTaken, actionOther){
    var staff = currentStaff();
    try{
      var res = await apiPost("forwardDocument", { docId:docId, toOfficeId:toOfficeId, remarks:remarks, actionTaken:actionTaken||[], actionOther:actionOther||"", actorStaffId:staff.id });
      if(!res.ok){ showToast(res.error||"Couldn't save — try again."); return; }
      applyData(res.data);
      showToast("Document forwarded to "+officeName(toOfficeId)+"."+notifySuffix(res.notify));
      setState({ detailId:null, transmittalId:docId });
    }catch(e){ showToast("Couldn't reach the server — try again."); }
  }

  async function updateStatus(docId, status, remarks, actionTaken, actionOther){
    var staff = currentStaff();
    try{
      var res = await apiPost("updateStatus", { docId:docId, status:status, remarks:remarks, actionTaken:actionTaken||[], actionOther:actionOther||"", actorStaffId:staff.id });
      if(!res.ok){ showToast(res.error||"Couldn't save — try again."); return; }
      applyData(res.data);
      showToast("Status updated to “"+status+"”."+notifySuffix(res.notify));
      render();
    }catch(e){ showToast("Couldn't reach the server — try again."); }
  }

  async function uploadFile(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error("Couldn't read the file.")); };
      reader.onload = function(){
        var dataUrl = reader.result || "";
        var base64 = String(dataUrl).split(",")[1] || "";
        apiPost("uploadFile", { filename:file.name, mimeType:file.type, dataBase64:base64 }).then(function(res){
          if(res.ok) resolve(res); else reject(new Error(res.error||"Upload failed."));
        }).catch(reject);
      };
      reader.readAsDataURL(file);
    });
  }

  async function sendTransmittal(payload){
    var staff = currentStaff();
    try{
      var res = await apiPost("sendTransmittal", { payload:payload, actorStaffId: staff.id });
      if(!res.ok){ showToast(res.error||"Couldn't send — try again."); return null; }
      applyData(res.data);
      var delivered = (res.results||[]).filter(function(r){return r.sent;}).length;
      var total = (res.results||[]).length;
      var notConfigured = (res.results||[]).some(function(r){return !r.sent && r.reason==="not_configured";});
      var msg = "Transmittal slip sent — "+delivered+" of "+total+" email(s) delivered."+(notConfigured?" (SMTP not configured on this site yet)":"");
      showToast(msg);
      setState({ view:"transmittal" });
      return res;
    }catch(e){ showToast("Couldn't reach the server — try again."); return null; }
  }

  async function sendMessage(docId, subject, body){
    var doc = mem.documents[docId];
    try{
      var res = await apiPost("sendMessage", { docId:docId, subject:subject, body:body });
      if(!res.ok){ showToast(res.error||"Couldn't send — try again."); return; }
      applyData(res.data);
      showToast("Message sent regarding "+(doc?doc.dtsNo:"")+".");
      render();
    }catch(e){ showToast("Couldn't reach the server — try again."); }
  }

  async function markMessagesRead(){
    if(!messagesArr().some(function(m){return !m.read;})) return;
    try{ var res = await apiPost("markMessagesRead", {}); if(res.ok){ applyData(res.data); render(); } }catch(e){}
  }

  async function addOffice(name){
    if(!name.trim()) return;
    try{
      var res = await apiPost("addOffice", { name:name.trim() });
      if(res.ok) applyData(res.data); else showToast(res.error||"Couldn't save — try again.");
      render();
    }catch(e){ showToast("Couldn't reach the server — try again."); }
  }
  async function removeOffice(id){
    try{
      var res = await apiPost("removeOffice", { id:id });
      if(res.ok) applyData(res.data); else showToast(res.error||"Can't remove — office is in use by staff or documents.");
      render();
    }catch(e){ showToast("Couldn't reach the server — try again."); }
  }
  async function addStaff(data){
    if(!data.name.trim() || !/^[0-9]{4}$/.test(data.pin)){ showToast("Enter a name and a 4-digit PIN."); return; }
    try{
      var res = await apiPost("addStaff", { name:data.name.trim(), title:data.title.trim()||"Staff", officeId:data.officeId, role:data.role, pin:data.pin });
      if(res.ok){ applyData(res.data); showToast("Staff account created."); } else showToast(res.error||"Couldn't save — try again.");
      render();
    }catch(e){ showToast("Couldn't reach the server — try again."); }
  }
  async function removeStaff(id){
    if(state.session && state.session.id===id){ showToast("You can't remove your own account while logged in."); return; }
    try{
      var res = await apiPost("removeStaff", { id:id });
      if(res.ok) applyData(res.data); else showToast(res.error||"Can't remove the last admin account.");
      render();
    }catch(e){ showToast("Couldn't reach the server — try again."); }
  }
  async function clearSampleData(){
    try{
      var res = await apiPost("clearSamples", {});
      if(res.ok){ applyData(res.data); showToast("Sample records cleared."); }
      render();
    }catch(e){ showToast("Couldn't reach the server — try again."); }
  }

  function runTrack(q){
    var query = (q||"").trim().toUpperCase();
    if(!query){ setState({ trackResult:undefined, trackQuery:"" }); return; }
    var found = documentsArr().find(function(d){ return d.dtsNo.toUpperCase()===query; });
    setState({ trackResult: found||null, trackQuery:q });
  }

  /* ============ shared render pieces ============ */
  function pill(status){ return '<span class="pill '+(STATUS_CLASS[status]||"pill-pending")+'">'+esc(status)+'</span>'; }

  function timelineHtml(history){
    if(!history || !history.length) return '<p class="hint">No activity recorded yet.</p>';
    var items = history.slice().reverse().map(function(h){
      return '<li><div class="t-label">'+esc(h.label)+'</div>'+
        '<div class="t-meta">'+fmtDateTime(h.at)+' · '+esc(h.byStaffName||"")+' · '+pill(h.status)+'</div>'+
        (h.remarks?'<div class="t-remarks">'+esc(h.remarks)+'</div>':'')+'</li>';
    }).join("");
    return '<ul class="timeline">'+items+'</ul>';
  }

  function docSummaryHtml(d){
    return '' +
      '<div class="doc-head"><div><div class="doc-track mono">'+esc(d.dtsNo)+'</div></div>'+
        '<div style="display:flex; gap:8px; align-items:center;">'+(d.sample?'<span class="badge-sample">Sample</span>':"")+pill(d.status)+'</div></div>'+
      '<div class="doc-title">'+esc(d.title)+'</div>'+
      '<div class="meta-grid">'+
        '<div class="meta-item"><div class="k">Type</div><div class="v">'+esc(d.docType)+'</div></div>'+
        '<div class="meta-item"><div class="k">Document owner</div><div class="v">'+esc(d.documentOwner)+'</div></div>'+
        '<div class="meta-item"><div class="k">Action needed</div><div class="v">'+esc(d.actionNeeded==="Others"?(d.actionOtherText||"Others"):d.actionNeeded)+'</div></div>'+
        '<div class="meta-item"><div class="k">Folder/box/pages</div><div class="v">'+esc(d.foldersBoxes||"—")+' · '+esc(d.numPages||"—")+' pp.</div></div>'+
        '<div class="meta-item"><div class="k">Current office</div><div class="v">'+esc(d.destinationOfficeName||officeName(d.destinationOfficeId))+'</div></div>'+
        '<div class="meta-item"><div class="k">Logged</div><div class="v">'+fmtDate(d.createdAt)+'</div></div>'+
        '<div class="meta-item"><div class="k">Last update</div><div class="v">'+fmtDate(d.updatedAt)+'</div></div>'+
      '</div>'+
      '<h3 style="font-size:13.5px; margin-bottom:10px;">Routing history</h3>'+timelineHtml(d.history);
  }

  /* ============ submission and routing slip (printable) ============ */
  function actionTakenListHtml(checkedArr, otherText, remarksText){
    checkedArr = checkedArr||[];
    var items = ACTION_TAKEN_OPTIONS.map(function(opt){
      var on = checkedArr.indexOf(opt)>=0;
      return '<li>'+(on?'☑':'☐')+'&nbsp;'+esc(opt)+'</li>';
    }).join("");
    var otherLine = '<li>'+(otherText?'☑':'☐')+'&nbsp;'+(otherText?esc(otherText):'______________________')+'</li>';
    var remarksLine = remarksText ? ('<div style="margin-top:3px; font-style:italic;">"'+esc(remarksText)+'"</div>') : "";
    return '<ul class="rs-actiontaken-list">'+items+otherLine+'</ul>'+remarksLine;
  }

  function routingSlipCopyHtml(d, stub){
    var info = mem.schoolInfo;
    var letterhead = '<div class="rs-letterhead">'+
        '<div class="country">Republic of the Philippines</div>'+
        '<div class="dept">Department of Education</div>'+
        '<div class="sch">'+esc(info.schoolId||"")+' - '+esc(info.schoolName||"Castor Alviar National High School")+'</div>'+
      '</div>';
    var titleBlock = (stub?'<div class="claim-stub-banner">CLAIM STUB</div>':'')+'<div class="rs-title">SUBMISSION AND ROUTING SLIP</div>';

    var fields =
      '<div class="rs-field-row"><div><span class="lab">Document Control Number:</span> <span class="mono">'+esc(d.dtsNo)+'</span></div><div><span class="lab">Date:</span> '+fmtDate(d.createdAt)+'</div></div>'+
      '<div class="rs-field-row"><div style="flex:2 1 100%;"><span class="lab">Title :</span> '+esc(d.title)+'</div></div>'+
      '<div class="rs-field-row"><div><span class="lab">Document Owner:</span> '+esc(d.documentOwner)+'</div></div>'+
      '<div class="rs-field-row"><div><span class="lab">Destination:</span> '+esc(d.destinationOfficeName)+'</div></div>'+
      '<div class="rs-field-row"><div><span class="lab">No. of folder/box/envelope:</span> '+esc(d.foldersBoxes||"—")+'</div><div><span class="lab">No. of pages:</span> '+esc(d.numPages||"—")+'</div></div>';

    var checkOpts = ["For signature/approval","For review/comment","For filing","For recommendation"];

        '<div class="sig-cols">'+SIGNATORY_CATEGORIES.map(sigColumnHtml).join("")+'</div>'+
        '<div class="field"><label>Others</label><div class="row row-2"><input name="otherName" placeholder="Name"><input type="email" name="otherEmail" placeholder="Email address"></div></div>'+
        '<div class="rs-section-title">Action to be taken</div>'+
        '<div class="check-grid">'+
          '<div>'+actionColumnHtml(TRANSMITTAL_ACTIONS.col1,"act1")+'</div>'+
          '<div>'+actionColumnHtml(TRANSMITTAL_ACTIONS.col2,"act2")+'</div>'+
          '<div>'+actionColumnHtml(TRANSMITTAL_ACTIONS.col3,"act3")+'</div>'+
        '</div>'+
        '<div class="field"><label>For appropriate action</label><input name="actionOtherText" placeholder="Free text (optional)"></div>'+
        '<div class="field"><label>Remarks</label><textarea name="remarks" placeholder="Remarks (optional)"></textarea></div>'+
        '<div class="field"><label>Attach a file (optional)</label><input type="file" name="file" id="transmittal-file"></div>'+
        '<div class="hint" style="margin-bottom:10px;">Signed by <strong>'+esc(info.principalName||"Rhoda O. Dela Cruz")+'</strong>, '+esc(info.principalTitle||"School Principal")+'.</div>'+
        '<button class="btn btn-primary" type="submit">✉ Send Transmittal Slip</button>'+
      '</form>'+
    '</div>'+
    '<div class="card"><div class="card-title">Transmittal slips sent</div>'+sentRows+'</div>';
  }

  function docDetailModal(){
    if(!state.detailId) return "";
    var d = mem.documents[state.detailId];
    if(!d) return "";
    var officeOpts = officesArr().filter(function(o){return o.id!==d.destinationOfficeId;}).map(function(o){ return '<option value="'+o.id+'">'+esc(o.name)+'</option>'; }).join("");
    var statusOpts = STATUSES.map(function(s){ return '<option '+(s===d.status?"selected":"")+'>'+esc(s)+'</option>'; }).join("");
    var actions = currentStaff() ? (
      '<div class="row row-2">'+
        '<form id="forward-form"><label>Forward to office</label><select name="toOfficeId" style="margin-bottom:8px;">'+officeOpts+'</select>'+
          actionTakenCheckboxesHtml("fwd")+
          '<textarea name="remarks" placeholder="Remarks (optional)" style="margin-bottom:8px;"></textarea><button class="btn btn-primary btn-sm" type="submit">Forward &amp; print slip</button></form>'+
        '<form id="status-form"><label>Update status</label><select name="status" style="margin-bottom:8px;">'+statusOpts+'</select>'+
          actionTakenCheckboxesHtml("st")+
          '<textarea name="remarks" placeholder="Remarks (optional)" style="margin-bottom:8px;"></textarea><button class="btn btn-sm" type="submit">Update status</button></form>'+
      '</div>'+
      '<form id="message-form" style="margin-top:14px; border-top:1px solid var(--border); padding-top:14px;"><label>Send a message about this document</label>'+
        '<input name="subject" placeholder="Subject" style="margin-bottom:8px;" required>'+
        '<textarea name="body" placeholder="Message" style="margin-bottom:8px;" required></textarea>'+
        '<button class="btn btn-sm" type="submit">Send message</button></form>'
    ) : '<p class="hint">Log in to forward this document or update its status.</p>';

    return '<div class="overlay" data-act="close-overlay">'+
      '<div class="modal modal-wide" onclick="event.stopPropagation()">'+
        '<div class="modal-head"><h3 style="font-size:16px;">Document detail</h3><button class="x-btn" data-act="close-detail">×</button></div>'+
        docSummaryHtml(d)+
        '<div style="display:flex; gap:8px; margin:14px 0;"><button class="btn btn-sm" data-act="view-transmittal" data-id="'+d.id+'">View transmittal form</button></div>'+
        '<div style="margin-top:6px; padding-top:16px; border-top:1px solid var(--border);">'+actions+'</div>'+
      '</div></div>';
  }

  function loginModal(){
    if(!state.showLogin) return "";
    var opts = staffArr().map(function(s){ return '<option value="'+s.id+'">'+esc(s.name)+' — '+esc(s.title||officeName(s.officeId))+'</option>'; }).join("");
    return '<div class="overlay" data-act="close-login">'+
      '<div class="modal" onclick="event.stopPropagation()">'+
        '<div class="modal-head"><h3 style="font-size:16px;">Staff log in</h3><button class="x-btn" data-act="close-login">×</button></div>'+
        (state.loginErr?'<div class="error-box">'+esc(state.loginErr)+'</div>':'')+
        '<form id="login-form">'+
          '<div class="field"><label>Staff account</label><select name="staffId">'+opts+'</select></div>'+
          '<div class="field"><label>PIN</label><input type="password" name="pin" maxlength="4" inputmode="numeric" required></div>'+
          '<button class="btn btn-primary btn-block" type="submit">Log in</button>'+
        '</form>'+
        '<div class="notice">First time here? Try <strong>Ruby B. Rodelas</strong> with PIN <strong class="mono">1234</strong>, then add real staff from Offices &amp; Staff.</div>'+
      '</div></div>';
  }

  /* ============ shell / render ============ */
  var clockTimer = null;
  function serverTimeStr(){
    var d = new Date();
    var date = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    var h = d.getHours(); var ap = h>=12?"pm":"am"; var h12 = h%12; if(h12===0) h12=12;
    var time = String(h12).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0")+" "+ap;
    return date+" "+time;
  }

  function sectionLabel(view){
    return { dashboard:"Dashboard", messages:"Messages", submit:"Submit Documents", status:"Document Status", transmittal:"Transmittal Slip", admin:"Offices & Staff" }[view] || "Dashboard";
  }

  function renderLoggedIn(){
    var s = currentStaff();
    var unread = messagesArr().filter(function(m){return !m.read;}).length;
    var navItem = function(view, icon, label, badge){
      return '<button class="snav-item '+(state.view===view?"active":"")+'" data-act="goto" data-view="'+view+'"><span class="ic">'+icon+'</span><span class="label">'+label+'</span>'+(badge?'<span class="snav-badge">'+badge+'</span>':'')+'</button>';
    };
    var statusSub = ["All"].concat(STATUSES).map(function(st){
      var val = st==="All" ? "" : st;
      var activeHere = state.view==="status" && (state.filters.status||"")===val;
      return '<button class="'+(activeHere?"active":"")+'" data-act="status-filter" data-status="'+esc(val)+'">'+esc(st)+'</button>';
    }).join("");

    var sidebar =
      '<div class="sidebar '+(state.sidebarCollapsed?"collapsed":"")+'">'+
        '<button class="collapse-btn" data-act="toggle-sidebar">'+(state.sidebarCollapsed?"»":"«")+'</button>'+
        '<div class="sidebar-profile"><div class="avatar-circle"><svg width="30" height="30" viewBox="0 0 24 24" fill="'+"#0b3d6e"+'"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></div>'+
          '<div class="who-text"><div class="name">'+esc(s.name)+'</div><div class="title">'+esc(s.title||officeName(s.officeId))+'</div></div>'+
        '</div>'+
        '<div class="sidebar-brand"><div class="logo-dot">DTS</div><div class="txt"><div class="t1">DTS V1.0</div><div class="t2">Document Tracking System v1.0</div></div></div>'+
        '<div class="sidebar-nav">'+
          navItem("dashboard","◈","Dashboard")+
          navItem("messages","✉","Messages", unread||null)+
          navItem("submit","📄","Submit Documents")+
          '<button class="snav-item '+(state.view==="status"?"active":"")+'" data-act="toggle-status-sub"><span class="ic">🗓</span><span class="label">Document Status</span><span class="snav-chev '+(state.statusSubOpen?"open":"")+'">&#8250;</span></button>'+
          (state.statusSubOpen?('<div class="snav-sub">'+statusSub+'</div>'):'')+
          (isAdmin()?navItem("transmittal","✉","Transmittal Slip"):'')+
          (isAdmin()?navItem("admin","⚙","Offices & Staff"):'')+
        '</div>'+
        '<div class="sidebar-foot label">Castor Alviar National High School<br>Masili, Calamba City</div>'+
      '</div>';

    var body;
    if(state.view==="messages") body = viewMessages();
    else if(state.view==="submit") body = viewSubmit();
    else if(state.view==="status") body = viewStatus();
    else if(state.view==="transmittal" && isAdmin()) body = viewTransmittal();
    else if(state.view==="admin" && isAdmin()) body = viewAdmin();
    else body = viewDashboard();

    var main =
      '<div class="main">'+
        '<div class="topbar2">'+
          '<div class="server-time">Server Time: '+serverTimeStr()+'</div>'+
          '<div class="account-wrap">'+
            '<button class="account-btn" data-act="toggle-account">👤 My Account ('+esc(mem.schoolInfo.schoolId)+'-'+esc(shortSchoolName())+') <span>▾</span></button>'+
            (state.accountMenuOpen ? '<div class="account-menu"><button data-act="goto" data-view="admin">Account settings</button><button data-act="logout">Log out</button></div>' : '')+
          '</div>'+
        '</div>'+
        '<div class="crumbline">DTS v1.0 &nbsp;|&nbsp; '+sectionLabel(state.view)+'</div>'+
        '<div class="content">'+body+'</div>'+
      '</div>';

    return '<div class="shell">'+sidebar+main+'</div>'+
      docDetailModal()+submittedHistoryModal()+transmittalModal()+
      (state.toast?'<div class="toast">'+esc(state.toast)+'</div>':'');
  }

  function render(){
    var s = currentStaff();
    document.getElementById("app").innerHTML = s ? renderLoggedIn() : viewTrackPublic();
    wireEvents();
  }

  /* ============ event wiring ============ */
  function wireEvents(){
    var app = document.getElementById("app");

    app.querySelectorAll('[data-act="goto"]').forEach(function(el){ el.addEventListener("click", function(){ setState({ view: el.getAttribute("data-view"), accountMenuOpen:false }); }); });
    app.querySelectorAll('[data-act="open-login"]').forEach(function(el){ el.addEventListener("click", function(){ setState({ showLogin:true, loginErr:"" }); }); });
    app.querySelectorAll('[data-act="close-login"]').forEach(function(el){ el.addEventListener("click", function(e){ if(e.target===el) setState({ showLogin:false, loginErr:"" }); }); });
    app.querySelectorAll('[data-act="logout"]').forEach(function(el){ el.addEventListener("click", doLogout); });
    app.querySelectorAll('[data-act="toggle-account"]').forEach(function(el){ el.addEventListener("click", function(){ setState({ accountMenuOpen: !state.accountMenuOpen }); }); });
    app.querySelectorAll('[data-act="toggle-sidebar"]').forEach(function(el){ el.addEventListener("click", function(){ setState({ sidebarCollapsed: !state.sidebarCollapsed }); }); });
    app.querySelectorAll('[data-act="toggle-status-sub"]').forEach(function(el){ el.addEventListener("click", function(){ if(state.view!=="status"){ setState({ view:"status", statusSubOpen:true }); } else { setState({ statusSubOpen: !state.statusSubOpen }); } }); });
    app.querySelectorAll('[data-act="status-filter"]').forEach(function(el){ el.addEventListener("click", function(){ state.filters.status = el.getAttribute("data-status"); setState({ view:"status" }); }); });

    app.querySelectorAll('[data-act="open-doc"]').forEach(function(el){ el.addEventListener("click", function(){ setState({ detailId: el.getAttribute("data-id") }); }); });
    app.querySelectorAll('[data-act="close-detail"]').forEach(function(el){ el.addEventListener("click", function(){ setState({ detailId:null }); }); });
    app.querySelectorAll('[data-act="close-overlay"]').forEach(function(el){ el.addEventListener("click", function(e){ if(e.target===el) setState({ detailId:null }); }); });

    app.querySelectorAll('[data-act="open-history"]').forEach(function(el){ el.addEventListener("click", function(){ setState({ showHistory:true }); }); });
    app.querySelectorAll('[data-act="close-history"]').forEach(function(el){ el.addEventListener("click", function(e){ if(e.target===el || e.currentTarget===el) setState({ showHistory:false }); }); });

    app.querySelectorAll('[data-act="view-transmittal"]').forEach(function(el){ el.addEventListener("click", function(){ setState({ transmittalId: el.getAttribute("data-id"), detailId:null }); }); });
    app.querySelectorAll('[data-act="close-transmittal"]').forEach(function(el){ el.addEventListener("click", function(e){ if(e.target===el || e.currentTarget===el) setState({ transmittalId:null }); }); });
    app.querySelectorAll('[data-act="print-transmittal"]').forEach(function(el){ el.addEventListener("click", function(){ window.print(); }); });

    app.querySelectorAll('[data-act="chip"]').forEach(function(el){ el.addEventListener("click", function(){ runTrack(el.getAttribute("data-track")); }); });
    app.querySelectorAll('[data-act="del-office"]').forEach(function(el){ el.addEventListener("click", function(){ removeOffice(el.getAttribute("data-id")); }); });
    app.querySelectorAll('[data-act="del-staff"]').forEach(function(el){ el.addEventListener("click", function(){ removeStaff(el.getAttribute("data-id")); }); });
    app.querySelectorAll('[data-act="clear-samples"]').forEach(function(el){ el.addEventListener("click", clearSampleData); });

    var trackForm = document.getElementById("track-form");
    if(trackForm) trackForm.addEventListener("submit", function(e){ e.preventDefault(); runTrack(document.getElementById("track-input").value); });

    var loginForm = document.getElementById("login-form");
    if(loginForm) loginForm.addEventListener("submit", function(e){ e.preventDefault(); doLogin(loginForm.staffId.value, loginForm.pin.value); });

    var submitForm = document.getElementById("submit-doc-form");
    if(submitForm){
      var subTypeSel = document.getElementById("submission-type");
      var fileField = document.getElementById("file-link-field");
      function syncFileField(){ fileField.style.display = subTypeSel.value==="Soft Copy" ? "block" : "none"; }
      if(subTypeSel){ subTypeSel.addEventListener("change", syncFileField); syncFileField(); }
      var actionSel = document.getElementById("action-needed-select");
      var actionOtherField = document.getElementById("action-other-field");
      function syncActionOther(){ actionOtherField.style.display = actionSel.value==="Others" ? "block" : "none"; }
      if(actionSel){ actionSel.addEventListener("change", syncActionOther); syncActionOther(); }
      submitForm.addEventListener("submit", function(e){
        e.preventDefault();
        var fd = new FormData(submitForm);
        submitNewDocument({
          documentOwner: fd.get("documentOwner"), contactNo: fd.get("contactNo"), email: fd.get("email"),
          foldersBoxes: fd.get("foldersBoxes"), numPages: fd.get("numPages"), docType: fd.get("docType"), title: fd.get("title"),
          destinationOfficeId: fd.get("destinationOfficeId"), actionNeeded: fd.get("actionNeeded"), actionOtherText: fd.get("actionOtherText"),
          submissionType: fd.get("submissionType"), fileLink: fd.get("fileLink")
        });
        submitForm.reset();
      });
    }

    var historySearch = document.getElementById("history-search");
    if(historySearch) historySearch.addEventListener("input", function(){ state.historyQuery = historySearch.value; render(); });
    var msgSearch = document.getElementById("msg-search");
    if(msgSearch) msgSearch.addEventListener("input", function(){ state.filters.q = msgSearch.value; state.messagesPage = 1; render(); });
    app.querySelectorAll('[data-act="msg-page"]').forEach(function(el){ el.addEventListener("click", function(){ setState({ messagesPage: parseInt(el.getAttribute("data-page"),10) }); }); });

    var docSearch = document.getElementById("doc-search");
    if(docSearch) docSearch.addEventListener("input", function(){ state.filters.q = docSearch.value; render(); });
    var filterStatus = document.getElementById("filter-status");
    if(filterStatus) filterStatus.addEventListener("change", function(){ state.filters.status = filterStatus.value; render(); });
    var filterOffice = document.getElementById("filter-office");
    if(filterOffice) filterOffice.addEventListener("change", function(){ state.filters.office = filterOffice.value; render(); });

    var forwardForm = document.getElementById("forward-form");
    if(forwardForm) forwardForm.addEventListener("submit", function(e){
      e.preventDefault();
      var fd = new FormData(forwardForm);
      var taken = []; forwardForm.querySelectorAll('input[name="fwd-taken"]:checked').forEach(function(cb){ taken.push(cb.value); });
      forwardDocument(state.detailId, fd.get("toOfficeId"), fd.get("remarks"), taken, fd.get("fwd-other"));
    });
    var statusForm = document.getElementById("status-form");
    if(statusForm) statusForm.addEventListener("submit", function(e){
      e.preventDefault();
      var fd = new FormData(statusForm);
      var taken = []; statusForm.querySelectorAll('input[name="st-taken"]:checked').forEach(function(cb){ taken.push(cb.value); });
      updateStatus(state.detailId, fd.get("status"), fd.get("remarks"), taken, fd.get("st-other"));
    });
    var messageForm = document.getElementById("message-form");
    if(messageForm) messageForm.addEventListener("submit", function(e){ e.preventDefault(); var fd=new FormData(messageForm); sendMessage(state.detailId, fd.get("subject"), fd.get("body")); messageForm.reset(); });

    var addOfficeForm = document.getElementById("add-office-form");
    if(addOfficeForm) addOfficeForm.addEventListener("submit", function(e){ e.preventDefault(); addOffice(addOfficeForm.name.value); addOfficeForm.reset(); });
    var addStaffForm = document.getElementById("add-staff-form");
    if(addStaffForm) addStaffForm.addEventListener("submit", function(e){ e.preventDefault(); var fd=new FormData(addStaffForm); addStaff({name:fd.get("name"), title:fd.get("title"), pin:fd.get("pin"), officeId:fd.get("officeId"), role:fd.get("role")}); addStaffForm.reset(); });
    var schoolInfoForm = document.getElementById("school-info-form");
    if(schoolInfoForm) schoolInfoForm.addEventListener("submit", async function(e){
      e.preventDefault();
      var fd = new FormData(schoolInfoForm);
      var data = { schoolId:fd.get("schoolId"), schoolName:fd.get("schoolName"), address:fd.get("address"), contact:fd.get("contact"), email:fd.get("email"), principalName:fd.get("principalName"), principalTitle:fd.get("principalTitle") };
      try{
        var res = await apiPost("saveSchoolInfo", { data:data });
        if(res.ok){ applyData(res.data); showToast("School info saved."); } else showToast(res.error||"Couldn't save — try again.");
      }catch(err){ showToast("Couldn't reach the server — try again."); }
      render();
    });

    var transmittalDocSelect = document.getElementById("transmittal-doc-select");
    if(transmittalDocSelect) transmittalDocSelect.addEventListener("change", function(){
      var doc = mem.documents[transmittalDocSelect.value];
      var titleInput = document.getElementById("transmittal-title");
      if(doc && titleInput) titleInput.value = doc.title;
    });
    var transmittalForm = document.getElementById("transmittal-form");
    if(transmittalForm){
      transmittalForm.addEventListener("submit", async function(e){
        e.preventDefault();
        var fd = new FormData(transmittalForm);
        var recipients = [];
        transmittalForm.querySelectorAll('input[name="sig"]:checked').forEach(function(cb){
          var emailInput = transmittalForm.querySelector('input[data-for="'+cb.value+'"]');
          recipients.push({ id: cb.value, name: cb.getAttribute("data-name"), email: emailInput?emailInput.value.trim():"" });
        });
        var otherName = (fd.get("otherName")||"").trim();
        if(otherName) recipients.push({ id:"", name: otherName, email: (fd.get("otherEmail")||"").trim() });
        if(!recipients.length){ showToast("Select at least one recipient, or fill in the Others field."); return; }
        var actionsToBeTaken = [];
        transmittalForm.querySelectorAll('input[name="act1"]:checked,input[name="act2"]:checked,input[name="act3"]:checked').forEach(function(cb){ actionsToBeTaken.push(cb.value); });
        var submitBtn = transmittalForm.querySelector('button[type="submit"]');
        var origLabel = submitBtn ? submitBtn.textContent : "";
        if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Sending…"; }
        try{
          var fileId = "";
          var fileInput = document.getElementById("transmittal-file");
          if(fileInput && fileInput.files && fileInput.files[0]){
            var up = await uploadFile(fileInput.files[0]);
            fileId = up.fileId;
          }
          await sendTransmittal({
            dtsId: fd.get("dtsId") || null, title: fd.get("title"), recipients: recipients,
            actionsToBeTaken: actionsToBeTaken, actionOtherText: fd.get("actionOtherText"), remarks: fd.get("remarks"), fileId: fileId
          });
        }catch(err){
          showToast((err && err.message) || "Couldn't send — try again.");
          if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = origLabel; }
        }
      });
    }

    if(state.view==="messages" && document.querySelector('.msg-row.unread')){ markMessagesRead(); }
  }

  /* ============ boot ============ */
  render(); // instant paint from bundled seed data while the real data loads
  if(!clockTimer){ clockTimer = setInterval(function(){ var el=document.querySelector(".server-time"); if(el) el.textContent = "Server Time: "+serverTimeStr(); }, 1000); }
  loadAndRender();
  setInterval(loadAndRender, 15000); // lightweight polling refresh so other staff's changes show up
})();
</script>
</body>
</html>
